# =============================================================================
# FinOps Multi-Cloud Monitoring — Grafana Contact Point Provisioning
# =============================================================================
# Grafana OSS 11.2  |  apiVersion: 1
#
# All contact points use placeholder values.  Replace them before activating
# any alert rules (see docs/alert-activation-guide.md).
# =============================================================================

apiVersion: 1

contactPoints:
  - orgId: 1
    name: finops-slack
    receivers:
      - uid: finops-slack-receiver
        type: slack
        settings:
          url: REPLACE_ME_SLACK_WEBHOOK
          title: "{{ .CommonAnnotations.summary }}"
          text: >
            {{ range .Alerts }}
            *Alert:* {{ .Labels.alert_type }} — {{ .Status }}
            *Description:* {{ .Annotations.description }}
            *Severity:* {{ .Labels.severity }}
            {{ end }}
        disableResolveMessage: false

  - orgId: 1
    name: finops-email
    receivers:
      - uid: finops-email-receiver
        type: email
        settings:
          addresses: alerts@example.com
          subject: "[FinOps Alert] {{ .CommonAnnotations.summary }}"
          message: >
            Alert: {{ .Labels.alert_type }}
            Status: {{ .Status }}
            Summary: {{ .CommonAnnotations.summary }}
            Description: {{ .CommonAnnotations.description }}
        disableResolveMessage: false

  - orgId: 1
    name: finops-webhook
    receivers:
      - uid: finops-webhook-receiver
        type: webhook
        settings:
          url: https:// REPLACE_ME_WEBHOOK_URL
          httpMethod: POST
          message: |
            {
              "alert_type": "{{ .CommonLabels.alert_type }}",
              "severity": "{{ .CommonLabels.severity }}",
              "status": "{{ .Status }}",
              "summary": "{{ .CommonAnnotations.summary }}",
              "description": "{{ .CommonAnnotations.description }}"
            }
        disableResolveMessage: false