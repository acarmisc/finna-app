services:
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PG_DSN: ${PG_DSN:-postgres://finops:finops_dev@postgres:5432/finops}
      HOST: "0.0.0.0"
      PORT: "8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  extractor:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.extractor
    environment:
      EXTRACTOR_TYPE: ${EXTRACTOR_TYPE:-exchange_rates}
      PG_DSN: ${PG_DSN:-postgres://finops:finops_dev@postgres:5432/finops}

      BATCH_SIZE: "500"
      GCP_CSV_PATH: ${GCP_CSV_PATH:-}
      GCP_INGESTION_MODE: ${GCP_INGESTION_MODE:-bigquery}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ${GCP_CSV_PATH:-../resources/data}:/app/csv:ro
    profiles:
      - extractors

  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finops}
      POSTGRES_USER: ${POSTGRES_USER:-finops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finops_dev}
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
