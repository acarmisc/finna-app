# Grafana Deployment for FinOps
# Namespace: finna-app-staging

---
apiVersion: v1
kind: Secret
metadata:
  name: grafana-secret
  namespace: finna-app-staging
type: Opaque
stringData:
  admin-user: admin
  admin-password: finops-grafana-$(date +%Y%m%d)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: finna-app-staging
data:
  grafana.ini: |
    [server]
    protocol = http
    http_port = 3000
    domain = grafana-finna-staging.ces.abssrv.it
    root_url = https://grafana-finna-staging.ces.abssrv.it/
    
    [security]
    admin_user = admin
    admin_password = Grafana2026!
    disable_login_form = false
    
    [auth.anonymous]
    enabled = false
    
    [log]
    mode = console
    level = info
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: grafana
  namespace: finna-app-staging
  labels:
    app.kubernetes.io/name: grafana
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: finna-app-staging
  labels:
    app.kubernetes.io/name: grafana
    app.kubernetes.io/component: server
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: grafana
  template:
    metadata:
      labels:
        app.kubernetes.io/name: grafana
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: grafana
      securityContext:
        runAsNonRoot: true
        runAsUser: 472
        fsGroup: 472
      containers:
      - name: grafana
        image: grafana/grafana:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 3000
          name: http
          protocol: TCP
        env:
        - name: GF_PATHSprovisioning_datasources
          value: /etc/grafana/provisioning/datasources
        - name: GF_PATHSprovisioning_dashboards
          value: /etc/grafana/provisioning/dashboards
        - name: GF_PATHSprovisioning_plugins
          value: /etc/grafana/provisioning/plugins
        - name: GF_PATHSdata
          value: /var/lib/grafana
        - name: GF_PATHSlogs
          value: /var/log/grafana
        - name: GF_PATHSconfig
          value: /etc/grafana/grafana.ini
        - name: GF_PATHSplugins
          value: /var/lib/grafana/plugins
        - name: GF_PATHStmp
          value: /tmp/grafana
        - name: GF_SECURITY_ADMIN_USER
          value: admin
        - name: GF_SECURITY_ADMIN_PASSWORD
          value: Grafana2026!
        - name: GF_DATABASE_TYPE
          value: postgres
        - name: GF_DATABASE_HOST
          value: 10.1.128.19:5432
        - name: GF_DATABASE_NAME
          value: finna-staging
        - name: GF_DATABASE_USER
          value: finna-staging
        - name: GF_DATABASE_PASSWORD
          value: abstract.2026.A
        - name: GF_DATABASE_SSL_MODE
          value: require
        volumeMounts:
        - name: config
          mountPath: /etc/grafana/grafana.ini
          subPath: grafana.ini
        - name: storage
          mountPath: /var/lib/grafana
          subPath: grafana
        - name: tmp
          mountPath: /tmp
        - name: dashboards-dir
          mountPath: /var/lib/grafana/dashboards
        resources:
          requests:
            cpu: 100m
            memory: 128Mi
          limits:
            cpu: 250m
            memory: 256Mi
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop: ["ALL"]
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 5
          periodSeconds: 5
      volumes:
      - name: config
        configMap:
          name: grafana-config
      - name: storage
        emptyDir: {}
      - name: storage-backup
        persistentVolumeClaim:
          claimName: grafana-storage-claim
      - name: tmp
        emptyDir: {}
      - name: dashboards-dir
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: finna-app-staging
  labels:
    app.kubernetes.io/name: grafana
spec:
  type: ClusterIP
  ports:
  - port: 3000
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app.kubernetes.io/name: grafana
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: finna-app-staging
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
  labels:
    app.kubernetes.io/name: grafana
spec:
  rules:
  - host: grafana.finna-app-staging.svc.cluster.local
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: grafana
            port:
              number: 3000
  tls:
  - hosts:
    - grafana.finna-app-staging.svc.cluster.local
    secretName: grafana-tls
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: finna-app-staging
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
    - name: finna-staging-postgres
      type: postgres
      access: proxy
      url: 10.1.128.19:5432
      database: finna-staging
      user: finna-staging
      secureJsonData:
        password: abstract.2026.A
      jsonData:
        sslmode: require
        timescaledb: false
        maxOpenConns: 10
        maxIdleConns: 2
        connMaxLifetime: 14400
        database: finna-staging
      isDefault: true
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-provisioning
  namespace: finna-app-staging
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
    - name: 'FinOps Dashboards'
      orgId: 1
      folder: 'FinOps'
      folderUid: finops
      type: file
      disableDeletion: false
      updateIntervalSeconds: 60
      options:
        path: /var/lib/grafana/dashboards
  provisioners.yaml: |
    apiVersion: 1
    provisioners:
    - name: 'Dashboards'
      org_id: 1
      folder: 'FinOps'
      folder_uid: finops
      type: file
      disableDeletion: false
      updateIntervalSeconds: 60
      options:
        path: /var/lib/grafana/dashboards
