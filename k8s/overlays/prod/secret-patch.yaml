# Production secrets should use external-secrets operator:
# Install external-secrets operator and create SecretStore for your cloud provider
#
# Example with AWS Secrets Manager:
# apiVersion: external-secrets.io/v1beta1
# kind: SecretStore
# metadata:
#   name: aws-secrets
#   namespace: finops
# spec:
#   provider:
#     aws:
#       service: SecretsManager
#       region: us-east-1
#       auth:
#         jwt:
#           serviceAccountRef:
#             name: external-secrets-sa
#
# Then create ExternalSecret to sync from cloud provider:
# apiVersion: external-secrets.io/v1beta1
# kind: ExternalSecret
# metadata:
#   name: finops-secret
#   namespace: finops
# spec:
#   refreshInterval: 1h
#   secretStoreRef:
#     name: aws-secrets
#     kind: SecretStore
#   target:
#     name: finops-secret
#   data:
#   - secretKey: PG_DSN
#     remoteRef:
#       key: finops/prod/pg-dsn
#   - secretKey: JWT_SECRET
#     remoteRef:
#       key: finops/prod/jwt-secret
#   - secretKey: GCP_PROJECT_ID
#     remoteRef:
#       key: finops/prod/gcp-project-id
#   - secretKey: GCP_SERVICE_ACCOUNT_KEY
#     remoteRef:
#       key: finops/prod/gcp-service-account-key
#   - secretKey: AZURE_SUBSCRIPTION_ID
#     remoteRef:
#       key: finops/prod/azure-subscription-id
#   - secretKey: AZURE_TENANT_ID
#     remoteRef:
#       key: finops/prod/azure-tenant-id
#   - secretKey: AZURE_CLIENT_ID
#     remoteRef:
#       key: finops/prod/azure-client-id
#   - secretKey: AZURE_CLIENT_SECRET
#     remoteRef:
#       key: finops/prod/azure-client-secret
apiVersion: v1
kind: Secret
metadata:
  name: finops-secret
  namespace: finops
type: Opaque
data: {}  # Populated via external-secrets operator
