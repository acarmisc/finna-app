apiVersion: apps/v1
kind: Deployment
metadata:
  name: finops-api
  namespace: finna-app-staging
  labels:
    app: finops-api
    environment: staging
spec:
  replicas: 1
  selector:
    matchLabels:
      app: finops-api
  template:
    metadata:
      labels:
        app: finops-api
        environment: staging
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
      containers:
      - name: api
        image: ghcr.io/acarmisc/finops-api:staging-test
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
        env:
        - name: HOST
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: API_HOST
        - name: PORT
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: API_PORT
        - name: PG_DSN
          valueFrom:
            secretKeyRef:
              name: finops-secret
              key: PG_DSN
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: finops-secret
              key: JWT_SECRET
        - name: ENVIRONMENT
          valueFrom:
            configMapKeyRef:
              name: finops-config
              key: ENVIRONMENT
        - name: AUTO_MIGRATE
          value: "true"
        startupProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 5
          failureThreshold: 30
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 30
          periodSeconds: 30
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz
            port: 8000
          initialDelaySeconds: 20
          periodSeconds: 10
          timeoutSeconds: 3
          failureThreshold: 3
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
