apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finops

resources:
  - ../../base

commonLabels:
  environment: dev

images:
  - name: finops-api
    newTag: dev-latest
  - name: finops-extractor
    newTag: dev-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: finops-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
            - name: api
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
    target:
      kind: Deployment
      name: finops-api
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: finops-config
      data:
        ENVIRONMENT: dev
        LOG_LEVEL: DEBUG
    target:
      kind: ConfigMap
      name: finops-config
