apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finops

resources:
  - ../../base

commonLabels:
  environment: dev

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: finops-api
      spec:
        replicas: 1
        template:
          spec:
            containers:
            - name: api
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "250m"
                limits:
                  memory: "256Mi"
                  cpu: "500m"
    target:
      kind: Deployment
      name: finops-api
  - patch: |-
      - op: replace
        path: /metadata/annotations
        value:
          environment: dev
    target:
      kind: ConfigMap
      name: finops-config

configMapGenerator:
  - name: finops-config
    behavior: replace
    literals:
      - ENVIRONMENT=dev
      - LOG_LEVEL=DEBUG
