apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finops

resources:
  - ../../base
  - hpa.yaml

commonLabels:
  environment: staging

images:
  - name: finops-api
    newTag: staging-latest
  - name: finops-extractor
    newTag: staging-latest

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: finops-api
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: api
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "500m"
                limits:
                  memory: "512Mi"
                  cpu: "1000m"
    target:
      kind: Deployment
      name: finops-api
  - patch: |-
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: finops-config
      data:
        ENVIRONMENT: staging
        LOG_LEVEL: INFO
    target:
      kind: ConfigMap
      name: finops-config
