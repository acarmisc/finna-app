apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: finops

resources:
  - ../../base

commonLabels:
  environment: staging

patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: finops-api
      spec:
        replicas: 2
        template:
          spec:
            containers:
            - name: api
              resources:
                requests:
                  memory: "256Mi"
                  cpu: "500m"
                limits:
                  memory: "512Mi"
                  cpu: "1000m"
    target:
      kind: Deployment
      name: finops-api

configMapGenerator:
  - name: finops-config
    behavior: replace
    literals:
      - ENVIRONMENT=staging
      - LOG_LEVEL=INFO
