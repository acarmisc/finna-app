apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-extractor-exchange-rates
  namespace: finops
  labels:
    app: finops-extractor
    extractor: exchange-rates
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: finops-extractor
            extractor: exchange-rates
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: extractor
            image: finops-extractor:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: EXTRACTOR_TYPE
              value: "exchange_rates"
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: finops-secret
                  key: PG_DSN
            resources:
              requests:
                memory: "128Mi"
                cpu: "100m"
              limits:
                memory: "256Mi"
                cpu: "250m"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
