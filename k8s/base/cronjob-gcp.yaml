apiVersion: batch/v1
kind: CronJob
metadata:
  name: finops-extractor-gcp
  namespace: finops
  labels:
    app: finops-extractor
    extractor: gcp-billing
spec:
  schedule: "0 */6 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  activeDeadlineSeconds: 3600
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app: finops-extractor
            extractor: gcp-billing
        spec:
          restartPolicy: OnFailure
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
          containers:
          - name: extractor
            image: finops-extractor:latest
            imagePullPolicy: IfNotPresent
            env:
            - name: EXTRACTOR_TYPE
              value: "gcp_billing"
            - name: GCP_PROJECT_ID
              valueFrom:
                secretKeyRef:
                  name: finops-secret
                  key: GCP_PROJECT_ID
            - name: GCP_SERVICE_ACCOUNT_KEY
              valueFrom:
                secretKeyRef:
                  name: finops-secret
                  key: GCP_SERVICE_ACCOUNT_KEY
            - name: PG_DSN
              valueFrom:
                secretKeyRef:
                  name: finops-secret
                  key: PG_DSN
            resources:
              requests:
                memory: "256Mi"
                cpu: "250m"
              limits:
                memory: "512Mi"
                cpu: "500m"
            securityContext:
              allowPrivilegeEscalation: false
              readOnlyRootFilesystem: true
              capabilities:
                drop:
                - ALL
