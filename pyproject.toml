[project]
name = "finna-app"
version = "0.1.0"
description = "Multi-cloud FinOps platform — normalize, aggregate, and visualize cost data from GCP, Azure, and LLM gateways"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "cryptography>=42.0",
    "python-jose[cryptography]>=3.3",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "boto3>=1.28",
    "pyarrow>=14.0",
    "google-cloud-bigquery>=3.11",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-resource>=23.0",
    "azure-identity>=1.14",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13.0",
    "keyring>=25.0",
    "msal-extensions>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "msal>=1.30",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1",
    "passlib>=1.7.4",
    "psycopg-pool>=3.3.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-instrumentation-fastapi>=0.41b0",
    "opentelemetry-exporter-otlp-proto-grpc>=1.20",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.4",
    "mypy>=1.10",
    "pytest>=8.0",
    "httpx>=0.27",
    "pytest-asyncio>=0.23",
    "pytest-cov>=7.1.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require database connectivity (deselect with '-m \"not integration\"')",
]

[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.ruff]
line-length = 120
target-version = "py311"
