[project]
name = "finna-app"
version = "0.1.0"
description = "Multi-cloud FinOps platform — normalize, aggregate, and visualize cost data from GCP, Azure, and LLM gateways"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.0",
    "boto3>=1.28",
    "pyarrow>=14.0",
    "google-cloud-bigquery>=3.11",
    "azure-mgmt-costmanagement>=4.0",
    "azure-mgmt-resource>=23.0",
    "azure-identity>=1.14",
    "pyyaml>=6.0",
    "tenacity>=8.2",
    "python-dotenv>=1.0",
    "questionary>=2.0",
    "rich>=13.0",
    "keyring>=25.0",
    "msal-extensions>=1.3",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "msal>=1.30",
    "prometheus-fastapi-instrumentator>=7.0",
    "slowapi>=0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "msal-extensions>=1.3",
]

[dependency-groups]
dev = [
    "pytest>=9.0",
    "msal-extensions>=1.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]