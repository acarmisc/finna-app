services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile.extractor
    environment:
      EXTRACTOR_TYPE: ${EXTRACTOR_TYPE:-exchange_rates}
      PG_DSN: postgres://finops:finops_dev@postgres:5432/finops
      BIFROST_PG_DSN: postgres://finops:finops_dev@postgres:5432/finops
      BIFROST_KEY_MAPPING_PATH: /app/config/bifrost_key_mapping.yaml
      BATCH_SIZE: "500"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - extractors

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  bifrost:
    image: maximhq/bifrost
    ports: ["8080:8080"]
    volumes:
      - ./bifrost/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  grafana:
    build:
      context: .
      dockerfile: Dockerfile.grafana
      args:
        GF_ADMIN_USER: admin
        GF_ADMIN_PASSWORD: admin
    ports: ["3000:3000"]
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  grafana_data: