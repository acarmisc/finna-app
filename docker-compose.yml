services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PG_DSN: "postgresql://${POSTGRES_USER:-finops}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}@postgres:5432/${POSTGRES_DB:-finops}"
      HOST: "0.0.0.0"
      PORT: "8000"
      JWT_SECRET: "${JWT_SECRET:?JWT_SECRET required (>=32 chars, see .env.example)}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:?ENCRYPTION_KEY required (>=32 chars, see .env.example)}"
      AUTO_MIGRATE: "${AUTO_MIGRATE:-false}"
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:?ALLOWED_ORIGINS required, comma-separated http(s):// URLs}"
      # OTEL_EXPORTER_OTLP_ENDPOINT: "http://otel-collector:4317"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: "${POSTGRES_DB:-finops}"
      POSTGRES_USER: "${POSTGRES_USER:-finops}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}"
      SEED_SAMPLE_DATA: "${SEED_SAMPLE_DATA:-false}"
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_docker.sql:/docker-entrypoint-initdb.d/01-schema.sql
      - ./sql/set_seed_sample_data.sh:/docker-entrypoint-initdb.d/04-set-seed-sample-data.sh
      - ./sql/seed_sample_data.sql:/docker-entrypoint-initdb.d/05-seed-sample-data.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finops}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
