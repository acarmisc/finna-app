services:
  extractor:
    build:
      context: .
      dockerfile: Dockerfile.extractor
    environment:
      EXTRACTOR_TYPE: ${EXTRACTOR_TYPE:-exchange_rates}
      PG_DSN: postgres://finops:finops_dev@postgres:5432/finops
      BIFROST_PG_DSN: postgres://finops:finops_dev@postgres:5432/finops
      BIFROST_KEY_MAPPING_PATH: /app/config/bifrost_key_mapping.yaml
      BATCH_SIZE: "500"
    depends_on:
      postgres:
        condition: service_healthy
    profiles:
      - extractors

  postgres:
    image: postgres:16-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

  bifrost:
    image: maximhq/bifrost
    ports: ["8080:8080"]
    volumes:
      - ./bifrost/data:/app/data
    depends_on:
      postgres:
        condition: service_healthy

  superset:
    build:
      context: .
      dockerfile: Dockerfile.superset
    ports: ["8088:8088"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE_ME_TO_A_RANDOM_SECRET}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@finops.local}
      SUPERSET_DATABASE_URI: postgresql://finops:finops_dev@postgres:5432/superset_meta
      FINOPS_PG_URI: postgresql://finops:finops_dev@postgres:5432/finops
      PYTHONPATH: /app/pythonpath
    volumes:
      - superset_data:/app/superset_home
    depends_on:
      postgres:
        condition: service_healthy
      superset-init:
        condition: service_completed_successfully

  superset-init:
    build:
      context: .
      dockerfile: Dockerfile.superset
    entrypoint: ["/bin/bash", "/app/bootstrap/init_superset.sh"]
    environment:
      SUPERSET_SECRET_KEY: ${SUPERSET_SECRET_KEY:-CHANGE_ME_TO_A_RANDOM_SECRET}
      SUPERSET_ADMIN_USERNAME: ${SUPERSET_ADMIN_USERNAME:-admin}
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-admin}
      SUPERSET_ADMIN_EMAIL: ${SUPERSET_ADMIN_EMAIL:-admin@finops.local}
      SUPERSET_DATABASE_URI: postgresql://finops:finops_dev@postgres:5432/superset_meta
      FINOPS_PG_URI: postgresql://finops:finops_dev@postgres:5432/finops
      SUPERSET_BASE_URL: http://superset:8088
      PYTHONPATH: /app/pythonpath
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pg_data:
  superset_data: