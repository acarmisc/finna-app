services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8000:8000"
    environment:
      PG_DSN: "postgresql://finops:finops_dev@postgres:5432/finops"
      HOST: "0.0.0.0"
      PORT: "8000"
      JWT_SECRET: "dev-secret-key-change-in-production"
      AUTO_MIGRATE: "true"
      ALLOWED_ORIGINS: "*"
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16-alpine
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: finops
      POSTGRES_USER: finops
      POSTGRES_PASSWORD: finops_dev
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./sql/init_docker.sql:/docker-entrypoint-initdb.d/00-schema.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finops"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pg_data:
