name: Update Images from ghcr.io

on:
  schedule:
    - cron: '0 0 * * 1'  # Every Monday
  workflow_dispatch:

jobs:
  update-staging:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      pull-requests: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install yq
        run: |
          sudo wget -qO /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Bump API image tag
        run: |
          API_TAG=$(curl -s -H "Authorization: Bearer $(echo ${{ secrets.GITHUB_TOKEN }} | base64)" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/finops-api/tags/list" | \
            jq -r '.tags[]?' | grep -E '^[0-9]+\.' | sort -V | tail -1)
          if [ -n "$API_TAG" ]; then
            yq -i \
              "(.images[] | select(.name == \"ghcr.io/acarmisc/finops-api\").newTag) = \"$API_TAG\"" \
              k8s/overlays/staging-deploy/kustomization.yaml
            echo "API → $API_TAG"
          else
            echo "No semver tag found for API; skipping"
          fi

      - name: Bump UI image tag
        run: |
          UI_TAG=$(curl -s -H "Authorization: Bearer $(echo ${{ secrets.GITHUB_TOKEN }} | base64)" \
            "https://ghcr.io/v2/${{ github.repository_owner }}/finna-app-ui/tags/list" | \
            jq -r '.tags[]?' | grep -E '^[0-9]+\.' | sort -V | tail -1)
          if [ -n "$UI_TAG" ]; then
            yq -i \
              "(.images[] | select(.name == \"finna-app-ui\").newTag) = \"$UI_TAG\"" \
              k8s/overlays/staging-deploy/kustomization.yaml
            echo "UI → $UI_TAG"
          else
            echo "No semver tag found for UI; skipping"
          fi

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v5
        with:
          commit-message: "chore: update k8s manifests to latest images"
          branch: "update-images-${{ github.sha }}"
          title: "chore: Update k8s manifests to latest images"
          body: |
            Auto-update Kubernetes manifests to use latest images from ghcr.io.

            - API: `ghcr.io/acarmisc/finops-api`
            - UI: `ghcr.io/acarmisc/finna-app-ui` (mapped to GCR via overlay)
