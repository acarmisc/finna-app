name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/finops-api

jobs:
  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Run Ruff linter
        run: ruff check backend/ extractors/ models/
      - name: Run mypy
        run: mypy backend/ extractors/ models/ --ignore-missing-imports --explicit-package-bases

  test:
    name: Backend Tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finna
          POSTGRES_PASSWORD: finna
          POSTGRES_DB: finna
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install dependencies
        run: pip install -e ".[dev]"
      - name: Initialize database
        # init_docker.sql is the stock-postgres-compatible schema (no pg_partman/pg_cron).
        # sql/init.sql is the prod variant that requires the partman extension and is
        # not available in the stock postgres:16 service image.
        run: PGPASSWORD=finna psql -v ON_ERROR_STOP=1 -h localhost -U finna -d finna -f sql/init_docker.sql
      - name: Run migrations
        run: |
          alembic stamp 001_baseline
          alembic upgrade head
        env:
          DATABASE_URL: postgresql://finna:finna@localhost:5432/finna
      - name: Verify psycopg connection
        run: python -c "import psycopg; conn = psycopg.connect('postgresql://finna:finna@localhost:5432/finna'); print('OK:', conn.info.dbname); conn.close()"
      - name: Run pytest
        run: pytest
        env:
          PGHOST: localhost
          PGUSER: finna
          PGPASSWORD: finna
          PGDATABASE: finna
          PG_DSN: postgresql://finna:finna@localhost:5432/finna
          PYTHONPATH: .
          OTEL_SDK_DISABLED: "true"

  build:
    name: Build Container
    needs: [backend-typecheck, test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4.5.2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=raw,value=latest
      - name: Reset buildx builder
        run: docker buildx rm -f builder || true && docker buildx create --name builder --driver docker-container || true

      - name: Build multi-platform image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          no-cache: true