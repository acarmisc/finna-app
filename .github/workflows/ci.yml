name: CI Pipeline

on:
  push:
    branches: [main, develop]
    paths-ignore:
      - 'docs/**'
      - 'README.md'
      - 'CLAUDE.md'
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/finops-api

jobs:
  # ─────────────────────────────────────────────────────────────
  # FAST: Lint + Type Check (run in parallel for speed)
  # ─────────────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run ruff
        run: ruff check .

  backend-typecheck:
    name: Backend Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run mypy
        run: mypy backend/ extractors/ models/ --ignore-missing-imports

  ui-typecheck:
    name: UI Type Check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tsc
        run: npx tsc --noEmit

  # ─────────────────────────────────────────────────────────────
  # FAST: Tests with artifacts
  # ─────────────────────────────────────────────────────────────
  test:
    name: Test Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: finna
          POSTGRES_PASSWORD: finna
          POSTGRES_DB: finna
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Initialize database
        run: |
          PGPASSWORD=finna psql -h localhost -U finna -d finna -f sql/init.sql

      - name: Run pytest with coverage
        run: |
          pytest --cov=backend --cov=extractors \
            --cov-report=xml --cov-report=term-missing \
            --junitxml=test-results.xml
        env:
          PGHOST: localhost
          PGUSER: finna
          PGPASSWORD: finna
          PGDATABASE: finna
          PYTHONPATH: .

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results.xml

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.xml

  ui-test:
    name: UI Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests with coverage
        run: npm run test:coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: ui-coverage
          path: ui/coverage

  # ─────────────────────────────────────────────────────────────
  # FULL: Build and security scan (only on main/tags)
  # ─────────────────────────────────────────────────────────────
  build:
    name: Build Container
    needs: [lint, backend-typecheck, ui-typecheck, test, ui-test]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    outputs:
      image: ${{ steps.meta.outputs.tags }}

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/finops-api
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{major}}
            type=sha
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build multi-platform image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: false
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scan
        run: |
          # Get the first tag from metadata (sha-xxx format)
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          docker buildx imagetools inspect $IMAGE_TAG --raw > /tmp/image.tar || \
          docker tag $IMAGE_TAG scan-target:latest
          docker run --rm -v /tmp:/tmp aquasecurity/trivy:latest \
            image --input /tmp/image.tar --format sarif -o trivy-results.sarif || \
            docker run --rm aquasecurity/trivy:latest \
            image scan-target:latest --format sarif -o trivy-results.sarif

      - name: Upload Trivy results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: trivy-results.sarif

      - name: Fail on critical vulnerabilities
        run: |
          count=$(cat trivy-results.sarif | jq -r '.results[].packages[]? | select(.severity == "CRITICAL") | .severity' | wc -l)
          if [ "$count" -gt 0 ]; then
            echo "Found $count CRITICAL vulnerabilities"
            exit 1
          fi
          echo "No critical vulnerabilities found"

      - name: Generate SBOM
        run: |
          IMAGE_TAG=$(echo "${{ steps.meta.outputs.tags }}" | cut -d',' -f1)
          docker buildx imagetools inspect $IMAGE_TAG --raw > /tmp/image.tar || \
          docker tag $IMAGE_TAG scan-target:latest
          docker run --rm -v /tmp:/tmp aquasecurity/trivy:latest \
            image --input /tmp/image.tar --format spdx -o sbom.spdx.json || \
            docker run --rm aquasecurity/trivy:latest \
            image scan-target:latest --format spdx -o sbom.spdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.spdx.json

      - name: Push to registry
        if: github.event_name == 'push'
        run: |
          for tag in $(echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n'); do
            docker push $tag
          done

  # ─────────────────────────────────────────────────────────────
  # STABLE: Release (only on tags)
  # ─────────────────────────────────────────────────────────────
  release:
    name: Create Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download SBOM
        uses: actions/download-artifact@v4
        with:
          name: sbom
          path: .

      - name: Generate changelog
        run: |
          git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 HEAD)..HEAD > CHANGELOG.md || echo "No previous tags" > CHANGELOG.md

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          bodyPath: CHANGELOG.md
          assets: |
            sbom.spdx.json
          generateReleaseNotes: true

  # ─────────────────────────────────────────────────────────────
  # STABLE: Deploy to staging (on main branch)
  # ─────────────────────────────────────────────────────────────
  deploy-staging:
    name: Deploy to Staging
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: https://staging.finna.example.com
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Install kustomize
        run: |
          curl -s "https://raw.githubusercontent.com/kubernetes-sigs/kustomize/master/hack/install_kustomize.sh" | bash && mv kustomize /usr/local/bin/

      - name: Update staging image tag
        run: |
          IMAGE=${{ needs.build.outputs.image }}
          IMAGE_NAME=$(echo "$IMAGE" | cut -d',' -f1)
          cd k8s/overlays/staging
          kustomize edit set image finops-api=$IMAGE_NAME

      - name: Create PR for staging update
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: "chore: update staging to ${{ github.sha }}"
          branch: "update-staging-${{ github.sha }}"
          title: "chore: Update staging image"
          body: |
            Auto-update staging Kubernetes manifests to use latest image from CI.

            Image: ${{ needs.build.outputs.image }}
            Commit: ${{ github.sha }}